<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <title>Frontend Mentor | Ping Coming Soon Page</title>

  <!-- Google Fonts: Libre Franklin (Weights: 300, 600, 700) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@300;600;700&display=swap" rel="stylesheet">

  <!-- Font Awesome CDN untuk Social Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'blue-500': 'hsl(223, 87%, 63%)',
            'blue-200': 'hsl(223, 100%, 88%)',
            'red-400': 'hsl(354, 100%, 66%)',
            'gray-400': 'hsl(0, 0%, 59%)',
            'blue-950': 'hsl(209, 33%, 12%)',
          },
          fontFamily: {
            sans: ['Libre Franklin', 'sans-serif'],
          },
          boxShadow: {
            'btn': '0px 5px 10px 2px rgba(77, 127, 255, 0.25)',
          }
        }
      }
    }
  </script>
</head>

<body class="font-sans min-h-screen bg-white text-blue-950 flex flex-col justify-between items-center py-12 px-6 md:py-20 selection:bg-blue-500 selection:text-white">

  <!-- Main Container -->
  <main class="w-full max-w-2xl mx-auto flex flex-col items-center text-center">
    
    <!-- Logo Header -->
    <header class="mb-8 md:mb-10">
      <img src="images/logo.svg" alt="Ping Logo" class="h-6 md:h-7 w-auto">
    </header>

    <!-- Heading Section -->
    <section class="mb-8 md:mb-10">
      <h1 class="text-2xl sm:text-4xl md:text-5xl font-light text-gray-400 leading-tight">
        We are launching <span class="font-bold text-blue-950">soon!</span>
      </h1>
      <p class="mt-3 text-xs sm:text-base md:text-lg text-blue-950 font-light">
        Subscribe and get notified
      </p>
    </section>

    <!-- Email Subscription Form -->
    <section class="w-full max-w-xl mb-12 md:mb-16">
      <form id="subscribe-form" novalidate class="flex flex-col md:flex-row items-start md:items-center gap-3 md:gap-4 relative">
        
        <!-- Input Group -->
        <div class="w-full flex-1 flex flex-col items-start relative">
          <label for="email" class="sr-only">Email Address</label>
          <input 
            type="email" 
            id="email" 
            name="email" 
            placeholder="Your email address..." 
            aria-required="true"
            aria-describedby="email-error"
            class="w-full px-8 py-3.5 md:py-4 border border-blue-200 rounded-full text-xs sm:text-sm md:text-base text-blue-950 placeholder:text-blue-200 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-colors duration-200"
          />
          <!-- Error Message Container -->
          <span 
            id="email-error" 
            class="error-message hidden text-xs font-semibold italic text-red-400 mt-2 md:absolute md:top-full md:left-8 md:mt-1.5"
            role="alert"
          ></span>
        </div>

        <!-- Submit Button -->
        <button 
          type="submit" 
          class="w-full md:w-auto md:min-w-[200px] py-3.5 md:py-4 px-8 bg-blue-500 hover:bg-blue-500/80 active:scale-[0.98] text-white font-semibold text-xs sm:text-sm md:text-base rounded-full shadow-btn transition-all duration-200 focus-visible:outline focus-visible:outline-2 focus-visible:outline-blue-950 focus-visible:outline-offset-2"
        >
          Notify Me
        </button>

      </form>
    </section>

    <!-- Dashboard Illustration -->
    <section class="w-full max-w-2xl mb-16 md:mb-20">
      <img src="images/Illustration-dashboard.png" 
        alt="Dashboard Preview Illustration" 
        class="w-full h-auto object-contain mx-auto"
      />
    </section>

  </main>

  <!-- Footer & Social Links -->
  <footer class="w-full flex flex-col items-center gap-6 mt-auto">
    
    <!-- Social Icons -->
    <nav aria-label="Social Media Links">
      <ul class="flex items-center gap-4">
        <li>
          <a 
            href="#" 
            aria-label="Facebook"
            class="w-8 h-8 md:w-9 md:h-9 border border-blue-200/60 rounded-full flex items-center justify-center text-blue-500 hover:bg-blue-500 hover:text-white hover:border-blue-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-blue-500 focus-visible:outline-offset-2 transition-all duration-200"
          >
            <i class="fa-brands fa-facebook-f text-xs md:text-sm" aria-hidden="true"></i>
          </a>
        </li>
        <li>
          <a 
            href="#" 
            aria-label="Twitter"
            class="w-8 h-8 md:w-9 md:h-9 border border-blue-200/60 rounded-full flex items-center justify-center text-blue-500 hover:bg-blue-500 hover:text-white hover:border-blue-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-blue-500 focus-visible:outline-offset-2 transition-all duration-200"
          >
            <i class="fa-brands fa-twitter text-xs md:text-sm" aria-hidden="true"></i>
          </a>
        </li>
        <li>
          <a 
            href="#" 
            aria-label="Instagram"
            class="w-8 h-8 md:w-9 md:h-9 border border-blue-200/60 rounded-full flex items-center justify-center text-blue-500 hover:bg-blue-500 hover:text-white hover:border-blue-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-blue-500 focus-visible:outline-offset-2 transition-all duration-200"
          >
            <i class="fa-brands fa-instagram text-xs md:text-sm" aria-hidden="true"></i>
          </a>
        </li>
      </ul>
    </nav>

    <!-- Copyright -->
    <p class="text-[10px] sm:text-xs text-gray-400 font-light">
      &copy; Copyright Ping. All rights reserved.
    </p>

    <!-- Atribusi Frontend Mentor -->
    <p class="text-[10px] text-gray-400">
      Challenge by 
      <a 
        href="https://www.frontendmentor.io?ref=challenge" 
        target="_blank" 
        rel="noopener noreferrer" 
        class="underline font-semibold hover:text-blue-500 focus-visible:outline focus-visible:outline-1 focus-visible:outline-blue-500 rounded"
      >
        Frontend Mentor
      </a>. 
      Coded by 
      <a 
        href="https://www.frontendmentor.io/profile/rarifingerstyle-svg" 
        target="_blank" 
        rel="noopener noreferrer" 
        class="underline font-semibold hover:text-blue-500 focus-visible:outline focus-visible:outline-1 focus-visible:outline-blue-500 rounded transition-colors"
      >
        Ahmad Asrari
      </a>.
    </p>
  </footer>

  <!-- Form Validation JavaScript Logic -->
<script src="js/validation.js"></script>
</body>
</html>
